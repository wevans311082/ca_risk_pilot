<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RiskPilot{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --rp-blue-primary: #003388;
            --rp-blue-hover: #002266;
            --rp-red-accent: #882211;
            --rp-gray-light: #f4f6f9;
        }
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(0, 51, 136, 0.10), transparent 24rem),
                linear-gradient(135deg, #f8fafc 0%, #eef2f7 100%);
            color: #333333;
        }
        .auth-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .auth-brand {
            color: var(--rp-blue-primary);
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .card-rp {
            border: 0;
            border-radius: 8px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.10);
            background-color: #ffffff;
        }
        .btn-rp-primary {
            background-color: var(--rp-blue-primary);
            border-color: var(--rp-blue-primary);
            color: #ffffff;
            font-weight: 600;
        }
        .btn-rp-primary:hover,
        .btn-rp-primary:focus {
            background-color: var(--rp-blue-hover);
            border-color: var(--rp-blue-hover);
            color: #ffffff;
        }
        .alert-rp {
            border-left: 4px solid var(--rp-blue-primary);
            border-radius: 4px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <main class="auth-shell">
        <div class="container py-4">
            <div class="d-flex align-items-center auth-brand">
                <i class="bi bi-shield-check me-2 fs-3"></i>
                <span>RiskPilot</span>
            </div>
        </div>
        <div class="container flex-grow-1 d-flex align-items-center">
            <div class="w-100">
                {% if messages %}
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-rp alert-dismissible fade show shadow-sm mb-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                {% endif %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
