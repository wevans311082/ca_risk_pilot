services:
  db:
    image: postgres:17-alpine
    container_name: riskpilot_prod_db
    environment:
      - POSTGRES_DB=riskpilot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_prod_password_change_me
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riskpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: riskpilot_prod_redis
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: riskpilot_prod_clamav
    volumes:
      - clamav_prod_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: riskpilot_prod_web
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 riskpilot.wsgi:application
    volumes:
      - staticfiles_prod:/app/staticfiles
      - mediafiles_prod:/app/mediafiles
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3

  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: riskpilot_prod_migration
    command: python manage.py migrate --noinput
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: riskpilot_prod_celery_worker
    command: celery -A riskpilot worker -l info
    volumes:
      - mediafiles_prod:/app/mediafiles
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A riskpilot inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: riskpilot_prod_celery_beat
    command: celery -A riskpilot beat -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'celery -A riskpilot beat' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: riskpilot_prod_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_prod:/app/staticfiles:ro
      - mediafiles_prod:/app/mediafiles:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --spider -q http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_prod_data:
  redis_prod_data:
  clamav_prod_data:
  staticfiles_prod:
  mediafiles_prod:
